name: Android checks

on:
  push:
    branches: [main]
    # Releases reuse the successful main run for their exact commit; tags do not rebuild.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build, unit tests and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
      - name: Workflow script regression
        run: python -m unittest discover -s scripts/tests -v
      - name: Bind evidence to source and APK
        run: |
          mkdir -p .tools/checks
          python scripts/source_state.py > .tools/checks/source-state.json
          sha256sum app/build/outputs/apk/debug/app-debug.apk > .tools/checks/APK_SHA256SUMS.txt
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-checks-${{ github.sha }}
          include-hidden-files: true
          path: |
            app/build/reports/
            app/build/test-results/
            .tools/checks/source-state.json
            .tools/checks/APK_SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
      # CI uses a disposable Debug key, not the local phone's existing signing key.
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: floating-focus-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
